[package]
name = "pastegrab-window"
version = "0.3.0"
description = "pastegrab's window: wires the adapters to the core and the view"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "pastegrab-app"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
pastegrab-app = { path = "../../crates/app" }
pastegrab-deploy = { path = "../../crates/deploy" }
pastegrab-domain = { path = "../../crates/domain" }
pastegrab-ffmpeg = { path = "../../crates/ffmpeg" }
pastegrab-http = { path = "../../crates/http" }
pastegrab-i18n = { path = "../../crates/i18n" }
pastegrab-os = { path = "../../crates/os" }
pastegrab-store = { path = "../../crates/store" }
pastegrab-update = { path = "../../crates/update" }
pastegrab-win32 = { path = "../../crates/win32" }
pastegrab-ytdlp = { path = "../../crates/ytdlp" }

[build-dependencies]
pastegrab-winres = { path = "../../crates/winres" }

[lints]
workspace = true
