[package]
name = "pastegrab-setup"
version = "0.1.0"
description = "pastegrab-setup.exe: one file that carries the program and every tool it runs"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
pastegrab-deploy = { path = "../../crates/deploy" }
pastegrab-i18n = { path = "../../crates/i18n" }
windows = { version = "0.62.2", features = [
    "Wdk_System_SystemServices",
    "Win32_Foundation",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Controls",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
pastegrab-winres = { path = "../../crates/winres" }

[lints]
workspace = true
