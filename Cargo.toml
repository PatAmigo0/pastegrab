[workspace]
resolver = "3"
members = ["apps/*", "crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
divan = "0.1.21"
linkify = "0.12"
proptest = "1.12"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = { version = "1.2.2", default-features = false, features = ["parse", "serde", "std"] }
url = "2.5"

[workspace.lints.rust]
missing_docs = "warn"
# Deny rather than forbid, so the `sys` modules of `os` and `win32` can allow it; pure crates forbid it.
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
# An overflow panics and fails its job instead of producing a wrong size or offset.
overflow-checks = true
# A worker panic fails one job instead of every download.
panic = "unwind"
strip = true
